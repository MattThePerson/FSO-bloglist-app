
name: Deploy pipeline

on:
  push:
    branches: [main]

jobs:
  # job: backend lint and test
  backend_lint_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install
      - run: npm run lint
      - run: npm test
  # job: Lint and Tests
  frontend_lint_test_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm run install:frontend
      - run: npm run lint:frontend
      - run: npm run test:frontend
      - run: npm run build:frontend
  # job: e2e_tests
  e2e_tests:
    needs: [backend_lint_test]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install and build frontend and backend
        run: npm run install:all && npm run build:frontend
      - name: Install playwright & browsers
        run: cd e2e-tests && npm install && npx playwright install --with-deps
      - name: Run Playwright tests
        run: cd e2e-tests && npm test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
  # job: bump version (patch)
  tag_release:
    needs: [frontend_lint_test_build, backend_lint_test, e2e_tests]
    if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' | '), '#notag') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: '0'
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
